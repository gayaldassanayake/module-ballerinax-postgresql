[package]
org = "ballerinax"
name = "postgresql"
version = "@toml.version@"
authors = ["Ballerina"]
keywords = ["client", "network", "SQL", "RDBMS", "Vendor/PostgreSQL", "Area/Database", "Type/Connector", "Type/Trigger"]
repository = "https://github.com/ballerina-platform/module-ballerinax-postgresql"
icon = "icon.png"
license = ["Apache-2.0"]
distribution = "2201.13.0"

[[package.modules]]
name = "postgresql.mcp"
export = true

[[dependency]]
org = "ballerina"
name = "mcp"
version = "1.1.1"
repository = "local"

[platform.java21]
graalvmCompatible = true

[[platform.java21.dependency]]
groupId = "io.ballerina.stdlib"
artifactId = "postgresql-native"
version = "@toml.version@"
path = "../native/build/libs/postgresql-native-@project.version@.jar"

[[platform.java21.dependency]]
groupId = "io.ballerina.stdlib"
artifactId = "sql-native"
version = "@sql.version@"
path = "./lib/sql-native-@sql.native.version@.jar"

services:
  postgres:
    image: postgres:16
    container_name: postgresql-mcp-demo
    environment:
      POSTGRES_USER: "mcp_user"
      POSTGRES_PASSWORD: "mcp_password"
      POSTGRES_DB: "mcp_demo"
    ports:
      - "5432:5432"
    volumes:
      - ./db-scripts/setup.sql:/docker-entrypoint-initdb.d/setup.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp_user -d mcp_demo"]
      interval: 5s
      timeout: 5s
      retries: 5
